    // Реестр УИК
    const uikRegistry = rawData.map(r => ({
      type: "uik",
      num: r[0],
      id: "uik_" + r[0],
      uik: `УИК № ${r[0]}`,
      lat: r[1],
      lng: r[2],
      object: r[3],
      address: r[4],
      district: r[5],
      roio: getDistrictRoioId(r[5], r[0]),
      goik: getGoikId(r[0])
    }));

    // Реестр ООИК
    const ooikRegistry = ooikData.map(m => ({
      type: "ooik",
      num: m[0],
      id: "ooik_" + m[0],
      uik: `ООИК № ${m[0]}`,
      lat: m[1],
      lng: m[2],
      object: m[3],
      address: m[4],
      district: "Областная окружная избирательная комиссия",
      roio: null,
      goik: null
    }));

    const allRegistry = [...ooikRegistry, ...uikRegistry];

    allRegistry.sort((a, b) => {
      const idxA = districtOrder.indexOf(a.district);
      const idxB = districtOrder.indexOf(b.district);
      if (idxA !== idxB) return idxA - idxB;
      return a.num - b.num;
    });

    let myMap, markersGroup, placemarks = {};

    ymaps.ready(() => {
      myMap = new ymaps.Map("map", {
        center: [52.30, 76.95],
        zoom: 9,
        type: 'yandex#map',
        controls: ['zoomControl', 'typeSelector', 'fullscreenControl']
      });

      markersGroup = new ymaps.GeoObjectCollection();
      myMap.geoObjects.add(markersGroup);

      // Клик по свободной области карты закрывает карточку
      myMap.events.add('click', () => {
        closeInfoCard();
      });

      allRegistry.forEach(item => {
        const isOoik = item.type === "ooik";
        const pm = new ymaps.Placemark([item.lat, item.lng], {
          iconContent: item.num,
          hintContent: `${item.uik}: ${item.object}`
        }, {
          preset: isOoik ? 'islands#redCircleIcon' : 'islands#darkGreenCircleIcon',
          draggable: false,
          hasBalloon: false // Отключаем стандартный белый всплывающий балун
        });

        // По клику на метку открываем карточку в правом углу
        pm.events.add('click', (e) => {
          e.stopPropagation();
          focusItem(item.id);
        });

        placemarks[item.id] = pm;
        markersGroup.add(pm);
      });

      onDistrictChange();
      document.getElementById('searchInput').addEventListener('input', onSearchInput);
    });

    // Функция отображения карточки в углу
    function openInfoCard(item) {
      const isOoik = item.type === "ooik";
      const titleColor = isOoik ? '#dc2626' : '#0d9488';
      const okrugPrefix = item.district === "Щербактинский район" ? "РОИО" : "РОИО";

      const titleHtml = `
        <span style="color: ${titleColor};">${item.uik}</span>
        ${item.roio ? `<span style="font-size:0.85rem; color:#d97706; margin-left:6px;">(${okrugPrefix} №${item.roio})</span>` : ''}
        ${item.goik ? `<span style="font-size:0.85rem; color:#0284c7; margin-left:6px;">(ГОИК №${item.goik})</span>` : ''}
      `;

      document.getElementById('cardTitle').innerHTML = titleHtml;
      document.getElementById('cardObject').textContent = item.object;
      document.getElementById('cardAddress').innerHTML = item.address ? `📍 <span>${item.address}</span>` : '';
      document.getElementById('cardDistrict').textContent = item.district;

      const card = document.getElementById('infoCard');
      card.style.display = 'block';
    }

    function closeInfoCard() {
      document.getElementById('infoCard').style.display = 'none';
      document.querySelectorAll('.item').forEach(el => el.classList.remove('active-item'));
    }

    window.findNearestUIK = function() {
      if (!navigator.geolocation) {
        alert("Геолокация не поддерживается вашим браузером");
        return;
      }
      const btn = document.querySelector('.btn-geo');
      btn.textContent = "⌛ Определение координат...";
      
      navigator.geolocation.getCurrentPosition(pos => {
        btn.innerHTML = "<span>📍</span> Ближайший участок";
        const userLat = pos.coords.latitude;
        const userLng = pos.coords.longitude;

        let nearest = null;
        let minDist = Infinity;

        uikRegistry.forEach(item => {
          const d = Math.hypot(item.lat - userLat, item.lng - userLng);
          if (d < minDist) {
            minDist = d;
            nearest = item;
          }
        });

        if (nearest) {
          document.getElementById('districtSelect').value = nearest.district;
          onDistrictChange();
          focusItem(nearest.id);
        }
      }, err => {
        btn.innerHTML = "<span>📍</span> Ближайший участок";
        alert("Не удалось определить местоположение. Проверьте разрешения GPS в браузере.");
      });
    };

    function onDistrictChange() {
      closeInfoCard();
      const distVal = document.getElementById('districtSelect').value;
      const okrugGroup = document.getElementById('okrugGroup');
      const okrugSelect = document.getElementById('okrugSelect');
      const okrugLabel = document.getElementById('okrugLabel');
      const titleEl = document.getElementById('districtTitle');
      const subtitleEl = document.getElementById('districtSubtitle');

      titleEl.textContent = distVal === 'all' ? 'Павлодарская область' : distVal;

      if (distVal === "Областная окружная избирательная комиссия") {
        okrugGroup.style.display = "block";
        okrugLabel.textContent = "2. Выбор ООИК";
        subtitleEl.textContent = "16 комиссий областных округов (ООИК № 1–16)";
        okrugSelect.innerHTML = `<option value="all">Все ООИК</option>` +
          ooikRegistry.map(m => `<option value="${m.num}">${m.uik} — ${m.object.substring(0, 32)}...</option>`).join('');
      } else if (distVal === "Городская окружная избирательная комиссия") {
        okrugGroup.style.display = "block";
        okrugLabel.textContent = "2. Выбор ГОИК";
        subtitleEl.textContent = "16 комиссий городских округов (ГОИК № 1–16)";
        okrugSelect.innerHTML = `<option value="all">Все ГОИК</option>` +
          goikDefinitions.map(g => `<option value="${g.id}">${g.title} (${g.territory})</option>`).join('');
      } else if (districtRoioMap[distVal]) {
        okrugGroup.style.display = "block";
        const isShcherb = (distVal === "Щербактинский район");
        okrugLabel.textContent = isShcherb ? "2. Районный округ (РОИО)" : "2. Избирательный округ (РОИО)";
        subtitleEl.textContent = isShcherb ? "11 Районных округов (РОИО № 1–11)" : `${districtRoioMap[distVal].length} округов (${distVal})`;
        
        const prefix = isShcherb ? "РОИО" : "РОИО";
        okrugSelect.innerHTML = `<option value="all">Все ${prefix}</option>` +
          districtRoioMap[distVal].map(item => {
            const uikStr = item.uiks.join(', ');
            return `<option value="${item.id}">${prefix} № ${item.id} (УИК № ${uikStr})</option>`;
          }).join('');
      } else {
        okrugGroup.style.display = "none";
        okrugSelect.value = "all";
        subtitleEl.textContent = distVal === 'all' ? 'Все избирательные участки области' : `Избирательные участки: ${distVal}`;
      }
      filterData(true);
    }

    function onOkrugChange() {
      closeInfoCard();
      filterData(true);
    }

    function onSearchInput() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      const currentDist = document.getElementById('districtSelect').value;

      if (searchVal) {
        const globalMatches = allRegistry.filter(item => 
          item.id.toLowerCase().includes(searchVal) || 
          item.uik.toLowerCase().includes(searchVal) ||
          item.num.toString() === searchVal ||
          item.object.toLowerCase().includes(searchVal) || 
          item.address.toLowerCase().includes(searchVal) ||
          (item.roio && `роио ${item.roio}`.includes(searchVal)) ||
          (item.roio && `роик ${item.roio}`.includes(searchVal)) ||
          (item.roio && `округ ${item.roio}`.includes(searchVal)) ||
          (item.type === 'ooik' && `ооик ${item.num}`.includes(searchVal)) ||
          (item.goik && `гоик ${item.goik}`.includes(searchVal))
        );

        const currentMatches = globalMatches.filter(item => {
          if (currentDist === "Городская окружная избирательная комиссия") return item.goik !== null;
          return item.district === currentDist;
        });

        if (currentDist !== 'all' && currentMatches.length === 0 && globalMatches.length > 0) {
          const targetDistrict = globalMatches[0].district;
          document.getElementById('districtSelect').value = targetDistrict;
          onDistrictChange();
          return;
        }
      }
      filterData(false);
    }

    function filterData(autoCenter) {
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      const distVal = document.getElementById('districtSelect').value;
      const okrugVal = document.getElementById('okrugSelect').value;

      const filtered = allRegistry.filter(item => {
        let matchDist = true;
        let matchOkr = true;

        if (distVal === "all") {
          matchDist = (item.type === "uik");
        } else if (distVal === "Областная окружная избирательная комиссия") {
          matchDist = (item.type === "ooik");
          if (okrugVal !== "all") matchOkr = (item.num.toString() === okrugVal);
        } else if (distVal === "Городская окружная избирательная комиссия") {
          matchDist = (item.type === "uik" && item.goik !== null);
          if (okrugVal !== "all") matchOkr = (item.goik && item.goik.toString() === okrugVal);
        } else if (districtRoioMap[distVal]) {
          matchDist = (item.district === distVal);
          if (okrugVal !== "all") matchOkr = (item.roio && item.roio.toString() === okrugVal);
        } else {
          matchDist = (item.district === distVal);
        }

        const matchSearch = !searchVal || 
                            item.uik.toLowerCase().includes(searchVal) ||
                            item.num.toString() === searchVal ||
                            item.object.toLowerCase().includes(searchVal) || 
                            item.address.toLowerCase().includes(searchVal) ||
                            (item.roio && `роио ${item.roio}`.includes(searchVal)) ||
                            (item.roio && `роик ${item.roio}`.includes(searchVal)) ||
                            (item.roio && `округ ${item.roio}`.includes(searchVal)) ||
                            (item.type === 'ooik' && `ооик ${item.num}`.includes(searchVal)) ||
                            (item.goik && `гоик ${item.goik}`.includes(searchVal));

        return matchDist && matchOkr && matchSearch;
      });

      const visibleCoords = [];
      allRegistry.forEach(item => {
        if (placemarks[item.id]) {
          const isVis = filtered.some(f => f.id === item.id);
          placemarks[item.id].options.set('visible', isVis);
          if (isVis) visibleCoords.push([item.lat, item.lng]);
        }
      });

      if (autoCenter && visibleCoords.length > 0) {
        if (visibleCoords.length === 1) {
          myMap.setCenter(visibleCoords[0], 17, { duration: 300 });
        } else {
          myMap.setBounds(ymaps.util.bounds.fromPoints(visibleCoords), { zoomMargin: 40, duration: 400 });
        }
      }

      renderList(filtered);
    }

    function focusItem(id) {
      const item = allRegistry.find(x => x.id === id);
      if (!item || !placemarks[id]) return;

      history.replaceState(null, null, `#${id}`);

      document.querySelectorAll('.item').forEach(el => el.classList.remove('active-item'));
      const activeEl = document.querySelector(`[data-id="${id}"]`);
      if (activeEl) {
        activeEl.classList.add('active-item');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      // Приближение карты до 17-го зума (видны здания, дворы и улицы)
      myMap.setCenter([item.lat, item.lng], 17, { duration: 350 });
      openInfoCard(item);
    }

    function renderList(items) {
      const listContainer = document.getElementById('uikList');
      listContainer.innerHTML = '';
      document.getElementById('counterText').textContent = `Отображено: ${items.length}`;

      items.forEach(item => {
        const isOoik = item.type === "ooik";
        const li = document.createElement('li');
        li.className = 'item';
        li.setAttribute('data-id', item.id);

        const okrugPrefix = item.district === "Щербактинский район" ? "РОИО" : "РОИО";
        const badgesHtml = isOoik ? '' : `
          <div class="item-badges">
            ${item.goik ? `<span class="badge-goik">ГОИК №${item.goik}</span>` : ''}
            ${item.roio ? `<span class="badge-okrug">${okrugPrefix} №${item.roio}</span>` : ''}
            <span class="badge-district">${item.district}</span>
          </div>
        `;

        li.innerHTML = `
          <div class="item-header">
            <span class="item-title" style="color: ${isOoik ? '#dc2626' : '#0d9488'};">${item.uik}</span>
            ${badgesHtml}
          </div>
          <div class="item-object">${item.object}</div>
          ${item.address ? `<div class="item-address">📍 ${item.address}</div>` : ''}
        `;
        li.onclick = () => focusItem(item.id);
        listContainer.appendChild(li);
      });
    }
  </script>
</body>
</html>
